name: README 릴리스 노트 자동 갱신

# 릴리스가 게시/수정/삭제되면 README.md의 릴리스 노트 구간을 다시 만들어 커밋한다.
on:
  release:
    types: [published, edited, deleted, released, unpublished]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: README 릴리스 노트 재생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FW_REPO: ${{ github.repository }}
        run: |
          chmod +x ./gen-readme.sh
          ./gen-readme.sh

      - name: 변경 사항 커밋
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md 변경 없음 — 커밋을 건너뜁니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📝 docs: 릴리스 노트 자동 갱신 (${{ github.event.release.tag_name || github.event_name }})"
          git push
